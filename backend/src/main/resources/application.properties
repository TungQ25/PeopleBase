spring.application.name=peoplebase-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peoplebase}
spring.datasource.username=${DB_USERNAME:peoplebase}
spring.datasource.password=${DB_PASSWORD:peoplebase}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Base64-encoded 256-bit secret. Override this value through APP_JWT_SECRET in non-local environments.
app.security.jwt.secret=${APP_JWT_SECRET:K0UutIEwnNUchctjiiSsziQ31dRmtEcakSI16MiGGX8=}
app.security.jwt.expiration=8h
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# A bootstrap ADMIN is created only when no ADMIN exists and both variables are supplied.
app.bootstrap.admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
