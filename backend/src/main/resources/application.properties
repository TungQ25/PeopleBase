spring.application.name=peoplebase-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/peoplebase}
spring.datasource.username=${DB_USERNAME:peoplebase}
spring.datasource.password=${DB_PASSWORD:peoplebase}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
